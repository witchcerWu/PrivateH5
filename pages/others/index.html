<script>
(function() {
  'use strict';

  // URL 参数定位：?start=project4 时滚动到 project4 起始位置
  var params = new URLSearchParams(window.location.search);
  var startTarget = params.get('start');
  if (startTarget) {
    var targetEl = document.getElementById(startTarget);
    if (targetEl) {
      // 等图片加载/布局完成后再定位
      window.addEventListener('load', function() {
        targetEl.scrollIntoView({ behavior: 'instant' });
      });
      // 也尝试立即定位（可能图片还没加载完，但至少到个大概位置）
      requestAnimationFrame(function() {
        targetEl.scrollIntoView({ behavior: 'instant' });
      });
    }
  }

  // 向上越界跳转到 page2（双向连续滚动）
  var upAccumulated = 0;
  var UP_THRESHOLD = 150;
  var lastWheelTime = 0;

  document.addEventListener('wheel', function(e) {
    var now = Date.now();

    // 200ms 无事件 = 新手势
    if (now - lastWheelTime > 200) {
      upAccumulated = 0;
    }
    lastWheelTime = now;

    // 只处理在页面顶部时的向上滚动
    var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (scrollTop > 5 || e.deltaY >= 0) {
      upAccumulated = 0;
      return;
    }

    // 累积向上滚动量
    upAccumulated += Math.abs(e.deltaY);

    if (upAccumulated >= UP_THRESHOLD) {
      upAccumulated = 0;
      // 跳转到 page2，标记反向进入
      if (window.__navSetFrom) window.__navSetFrom(3);
      sessionStorage.setItem('projectEntryDirection', 'backward');
      if (window.__navigateWithTransition) { window.__navigateWithTransition('../page2/index.html', 2); }
      else { window.location.href = '../page2/index.html'; }
    }
  }, { passive: true });
})();
</script>
